<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Waiting Room - Secure Excalidraw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f0f16 0%, #1e1e2f 100%);
      color: #cdd6f4;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    /* Subtle background grid pattern */
    body::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: 0;
    }
    .card {
      position: relative;
      background: rgba(30, 30, 47, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px;
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      z-index: 1;
      text-align: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    h1 {
      margin-top: 0;
      color: #ffffff;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.5px;
    }
    p {
      color: #a6adc8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .logo-container {
      margin-bottom: 25px;
    }
    .logo-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(137, 180, 250, 0.1);
      border: 1px solid rgba(137, 180, 250, 0.2);
      border-radius: 100px;
      color: #89b4fa;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 25px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #cdd6f4;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(17, 17, 27, 0.6);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s;
    }
    input:focus {
      border-color: #89b4fa;
      box-shadow: 0 0 0 3px rgba(137, 180, 250, 0.15);
      background: rgba(17, 17, 27, 0.8);
    }
    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
      font-family: inherit;
      background: linear-gradient(90deg, #89b4fa 0%, #b4befe 100%);
      color: #11111b;
      box-shadow: 0 4px 15px rgba(137, 180, 250, 0.3);
      transition: all 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(137, 180, 250, 0.45);
    }
    button:active {
      transform: translateY(0);
    }
    
    /* Waiting view details */
    .status-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }
    .spinner-ring {
      position: relative;
      width: 60px;
      height: 60px;
      margin-bottom: 25px;
    }
    .spinner-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 48px;
      height: 48px;
      margin: 6px;
      border: 4px solid #89b4fa;
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #89b4fa transparent transparent transparent;
    }
    .spinner-ring div:nth-child(1) { animation-delay: -0.45s; }
    .spinner-ring div:nth-child(2) { animation-delay: -0.3s; }
    .spinner-ring div:nth-child(3) { animation-delay: -0.15s; }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status-title {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .status-subtitle {
      font-size: 14px;
      color: #a6adc8;
    }
    
    /* Denied screen styling */
    .denied-icon {
      font-size: 48px;
      color: #f38ba8;
      margin-bottom: 20px;
    }
    
    .footer-note {
      margin-top: 30px;
      font-size: 12px;
      color: #7f849c;
    }
  </style>
</head>
<body>
  <div class="card" id="main-card">
    <div class="logo-container">
      <span class="logo-badge">Security Shield</span>
    </div>
    
    <div id="input-view">
      <h1>Request Collaboration</h1>
      <p>This is a highly secure private session. Please introduce yourself to request entry onto the whiteboard.</p>
      
      <form id="join-form" onsubmit="submitRequest(event)">
        <div class="form-group">
          <label for="username">Your Full Name or Username</label>
          <input type="text" id="username" placeholder="e.g. Alice Smith" required autocomplete="off">
        </div>
        <button type="submit">Ask to Join Board</button>
      </form>

    </div>
    
    <div id="status-view" class="status-container">
      <div class="spinner-ring">
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="status-title" id="status-headline">Sending Request...</div>
      <div class="status-subtitle" id="status-desc">Please wait while the host verifies your identity.</div>
    </div>
    
    <div class="footer-note" id="footer">
      Private connection protected by local gateway basic tunnels.
    </div>
  </div>

  <script>
    let pollInterval = null;
    let requestId = localStorage.getItem('excalidraw_request_id');

    // If request already exists, check status on load
    if (requestId) {
      showWaitingState();
      startPolling(requestId);
    }

    function showWaitingState(name = 'You') {
      document.getElementById('input-view').style.display = 'none';
      document.getElementById('status-view').style.display = 'flex';
      document.getElementById('status-headline').innerText = 'Waiting for Approval...';
      document.getElementById('status-desc').innerText = `Hello ${name}, your request has been sent to the board owner. Please keep this window open.`;
    }

    async function submitRequest(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username').value.trim();
      if (!usernameInput) return;

      document.getElementById('input-view').style.display = 'none';
      document.getElementById('status-view').style.display = 'flex';
      document.getElementById('status-headline').innerText = 'Submitting Request...';

      try {
        const res = await fetch(window.location.origin + '/api/request-join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: usernameInput })
        });
        
        if (!res.ok) throw new Error('Submission failed');
        
        const data = await res.json();
        requestId = data.requestId;
        localStorage.setItem('excalidraw_request_id', requestId);
        localStorage.setItem('excalidraw_request_name', usernameInput);
        
        showWaitingState(usernameInput);
        startPolling(requestId);
      } catch (err) {
        document.getElementById('input-view').style.display = 'block';
        document.getElementById('status-view').style.display = 'none';
        alert('Failed to send join request. Please verify network status.');
      }
    }

    function startPolling(reqId) {
      if (pollInterval) clearInterval(pollInterval);
      
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(window.location.origin + `/api/request-status?requestId=${reqId}`);
          if (!res.ok) return;
          
          const data = await res.json();
          if (data.status === 'approved') {
            clearInterval(pollInterval);
            document.getElementById('status-headline').innerText = 'Admitted!';
            document.getElementById('status-desc').innerText = 'Opening whiteboard...';
            
            // Set cookies for session and reload
            document.cookie = `excalidraw_session=${data.sessionToken}; Path=/; SameSite=Lax; Max-Age=86400`;
            document.cookie = `excalidraw_role=${data.role || 'viewer'}; Path=/; SameSite=Lax; Max-Age=86400`;
            
            // Clear local storage request
            localStorage.removeItem('excalidraw_request_id');
            localStorage.removeItem('excalidraw_request_name');
            
            setTimeout(() => {
              window.location.reload();
            }, 1000);
          } else if (data.status === 'denied') {
            clearInterval(pollInterval);
            localStorage.removeItem('excalidraw_request_id');
            localStorage.removeItem('excalidraw_request_name');
            showDeniedState();
          }
        } catch (e) {
          console.error('Error polling status:', e);
        }
      }, 2000);
    }

    function showDeniedState() {
      document.getElementById('input-view').style.display = 'none';
      document.getElementById('status-view').style.display = 'flex';
      
      // Replace spinner with Denied UI
      const statusView = document.getElementById('status-view');
      statusView.innerHTML = `
        <div class="denied-icon">🔒</div>
        <div class="status-title" style="color: #f38ba8;">Admission Denied</div>
        <div class="status-subtitle">The session host has rejected your join request. You are not authorized to view this whiteboard.</div>
        <button onclick="resetRequestView()" style="margin-top: 30px; background: rgba(255,255,255,0.08); color: #cdd6f4; border: 1px solid rgba(255,255,255,0.1); box-shadow: none;">Request Again</button>
      `;
    }

    function resetRequestView() {
      localStorage.removeItem('excalidraw_request_id');
      localStorage.removeItem('excalidraw_request_name');
      window.location.reload();
    }
  </script>
</body>
</html>
