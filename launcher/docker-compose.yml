services:
  gui:
    build:
      context: ..
      dockerfile: launcher/Dockerfile.gui
    ports:
      - "7842:7842"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/app
    networks:
      - internal

  excalidraw:
    build:
      context: ..
      dockerfile: launcher/Dockerfile.excalidraw
    environment:
      # Injected after ngrok is ready (two-phase start in gui/server.js).
      # Vite bakes this at startup so all clients (local + remote) connect
      # collab socket to the public ngrok URL, which proxies back to Vite.
      - VITE_APP_WS_SERVER_URL=${PUBLIC_URL:-}
      - VITE_APP_BACKEND_V2_GET_URL=/api/v2/
      - VITE_APP_BACKEND_V2_POST_URL=/api/v2/
    networks:
      - internal
    profiles:
      - session

  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    ports:
      - "3002:3002"
    networks:
      - internal
    profiles:
      - session

  redis:
    image: redis:alpine
    container_name: excalidraw-redis
    volumes:
      - ./redis-data:/data
    networks:
      - internal
    profiles:
      - session

  excalidraw-storage-backend:
    image: kiliandeca/excalidraw-storage-backend:latest
    container_name: excalidraw-storage-backend
    environment:
      - STORAGE_URI=redis://redis:6379
    depends_on:
      - redis
    networks:
      - internal
    profiles:
      - session

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      - AUTH_USER=${AUTH_USER}
      - AUTH_PASS=${AUTH_PASS}
      - TARGET_HOST=excalidraw
      - TARGET_PORT=3001
      - PROXY_PORT=8080
      - BIND_HOST=0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      - excalidraw
    networks:
      - internal
    profiles:
      - session

  ngrok:
    image: ngrok/ngrok:latest
    command: http proxy:8080 --log stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - proxy
    networks:
      - internal
    profiles:
      - session

networks:
  internal:
