services:
  gui:
    build:
      context: ..
      dockerfile: launcher/Dockerfile.gui
    ports:
      - "7842:7842"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/app
    networks:
      - internal

  excalidraw:
    build:
      context: ..
      dockerfile: launcher/Dockerfile.excalidraw
    environment:
      # Leave websocket URL empty so Socket.IO uses the same origin the browser
      # opened, whether that is localhost or the Tailscale hostname.
      - VITE_APP_WS_SERVER_URL=
      # Room links copied from the app should point at the authenticated
      # Tailscale URL, not localhost.
      - VITE_APP_PUBLIC_URL=${PUBLIC_URL_WITH_AUTH:-}
      - VITE_APP_BACKEND_V2_GET_URL=/api/v2/
      - VITE_APP_BACKEND_V2_POST_URL=/api/v2/
    networks:
      - internal
    profiles:
      - session

  excalidraw-room:
    image: excalidraw/excalidraw-room:latest
    networks:
      - internal
    profiles:
      - session

  redis:
    image: redis:alpine
    container_name: excalidraw-redis
    volumes:
      - ./redis-data:/data
    networks:
      - internal
    profiles:
      - session

  excalidraw-storage-backend:
    image: kiliandeca/excalidraw-storage-backend:latest
    container_name: excalidraw-storage-backend
    environment:
      - STORAGE_URI=redis://redis:6379
    depends_on:
      - redis
    networks:
      - internal
    profiles:
      - session

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TAILSCALE_HOSTNAME:-excalidraw-secure}
    environment:
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./tailscale-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8080:8080"
    networks:
      - internal
    profiles:
      - session

  proxy-tailscale:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    environment:
      - AUTH_USER=${AUTH_USER}
      - AUTH_PASS=${AUTH_PASS}
      - TARGET_HOST=excalidraw
      - TARGET_PORT=3001
      - ROOM_HOST=excalidraw-room
      - ROOM_PORT=80
      - STORAGE_HOST=excalidraw-storage-backend
      - STORAGE_PORT=8080
      - PROXY_PORT=8080
      - BIND_HOST=0.0.0.0
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - excalidraw
      - excalidraw-room
      - excalidraw-storage-backend
    profiles:
      - session

networks:
  internal:
